name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The Plugin Verifier downloads several IDEs.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # IntelliJ Platform 2024.2 (242) requires Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync the slang repository (grammar, corpus)
        run: tools/sync-slang.sh

      - name: Committed grammar matches the pinned slang commit
        run: git diff --exit-code src/main/grammar/Slang.bnf

      - name: Build, test, verify
        run: ./gradlew buildPlugin test verifyPlugin --stacktrace

      - name: Generated lexer/parser are committed and current
        # CLAUDE.md: src/main/gen is committed so IDE indexing works without a build.
        run: |
          git status --porcelain src/main/gen
          test -z "$(git status --porcelain src/main/gen)"

      - uses: actions/upload-artifact@v4
        with:
          name: slang-idea-plugin
          path: build/distributions/*.zip

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/reports/pluginVerifier
