# Plugin coordinates
pluginGroup=org.slang.idea
pluginName=Slang
pluginVersion=0.1.0

# IntelliJ Platform. The platform LSP API (com.intellij.platform.lsp) exists
# only in commercial IDEs, so we compile against IntelliJ IDEA Ultimate.
platformVersion=2024.2
pluginSinceBuild=242
pluginUntilBuild=252.*

# The slang repository commit this plugin is synced with (tools/sync-slang.sh).
# Bump deliberately; regenerate the parser when grammar/slang.bnf changes.
slangRepo=https://github.com/dvislobokov/slang
slangCommit=79c258822f55875648e659d8e0a69a4e5240b65a

# Gradle
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

# The platform bundles its own Kotlin stdlib; do not package another one.
kotlin.stdlib.default.dependency=false
