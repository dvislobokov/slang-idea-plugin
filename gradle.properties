# Plugin coordinates
pluginGroup=org.zell.idea
pluginName=Zell
pluginVersion=0.1.0

# IntelliJ Platform. The platform LSP API (com.intellij.platform.lsp) exists
# only in commercial IDEs, so we compile against IntelliJ IDEA Ultimate.
platformVersion=2024.2
pluginSinceBuild=242
pluginUntilBuild=252.*

# The zell repository commit this plugin is synced with (tools/sync-zell.sh).
# Bump deliberately; regenerate the parser when grammar/zell.bnf changes.
zellRepo=https://github.com/zell-lang/zell
zellCommit=4e8a16c05fd10eff4d7c48ef68210ee21d2986ea

# Gradle
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

# The platform bundles its own Kotlin stdlib; do not package another one.
kotlin.stdlib.default.dependency=false
